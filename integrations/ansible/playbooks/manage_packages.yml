---
# Example playbook: manage apps with static-pkgmgr via the custom module.
#
# Run it with:
#   ANSIBLE_LIBRARY=integrations/ansible/library ansible-playbook -i localhost, \
#     integrations/ansible/playbooks/manage_packages.yml
#
# The module assumes `static-pkgmgr` is on PATH and runs as the target user
# (so it installs into that user's ~/.local/{bin,opt}). For a real machine use
# a real inventory and `become: true` + `become_user: <target>`.
- name: Manage static-pkgmgr apps
  hosts: all
  become: false
  # The module runs `static-pkgmgr`, which only reads SPM_CONFIG_DIR and
  # GITHUB_TOKEN from the environment -- NOT APPS_DIR/BIN_DIR (§5). So
  # `environment:` here intentionally sets only those two plus SPM_TEST_MODE
  # for the fixture-based tests. Override install/link locations by writing
  # config.env inside the configured SPM_CONFIG_DIR instead.
  environment:
    SPM_CONFIG_DIR: "{{ spm_config_dir | default('/home/{{ ansible_user }}.config/static-pkgmgr') }}"
    SPM_TEST_MODE: "1"

  vars:
    # The fixture recipes used by the static-pkgmgr test suite resolve over
    # file:// URLs (only valid with SPM_TEST_MODE=1). In production, remove
    # test_mode and use the real packages/.
    spm_packages:
      - helloapp
      - withuninstall

  tasks:
    - name: Ensure required packages are present
      static_pkgmgr:
        name: "{{ spm_packages }}"
        state: present
        test_mode: true
      register: ensure_present

    - name: Show what changed
      ansible.builtin.debug:
        var: ensure_present

    - name: Upgrade packages to their latest pin (idempotent)
      static_pkgmgr:
        name: "{{ spm_packages }}"
        state: latest
        test_mode: true

    - name: Ensure one package is absent
      static_pkgmgr:
        name: withuninstall
        state: absent
        test_mode: true
