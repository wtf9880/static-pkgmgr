---
# End-to-end test of the static_pkgmgr Ansible module.
# Run from the repo root with:
#   ANSIBLE_LIBRARY=integrations/ansible/library ansible-playbook \
#     -i localhost, -c local --check integrations/ansible/tests/playbook_apply.yml
#
# Each task is followed by an assert that pins down the expected `changed`
# flag, so the playbook exits non-zero if idempotency is broken.
- name: Validate static_pkgmgr module idempotency
  hosts: localhost
  connection: local
  gather_facts: false

  # config_dir + test_mode are passed to the module; the module forwards
  # SPM_CONFIG_DIR / SPM_TEST_MODE to static-pkgmgr (APPS_DIR/BIN_DIR come
  # from config.env inside config_dir, since the tool ignores those env vars).
  vars:
    spm_config_dir: "{{ lookup('env','SPM_CONFIG_DIR') }}"

  tasks:
    - name: "present (not installed) -> installs, changed"
      static_pkgmgr:
        name: helloapp
        state: present
        test_mode: true
        config_dir: "{{ spm_config_dir }}"
      register: r_present_1
    - assert:
        that:
          - r_present_1.changed == true
        fail_msg: "expected changed=true when installing helloapp"

    - name: "present (already installed) -> no change"
      static_pkgmgr:
        name: helloapp
        state: present
        test_mode: true
        config_dir: "{{ spm_config_dir }}"
      register: r_present_2
    - assert:
        that:
          - r_present_2.changed == false
        fail_msg: "expected changed=false when helloapp already installed"

    - name: "latest (already at latest pin) -> no change"
      static_pkgmgr:
        name: helloapp
        state: latest
        test_mode: true
        config_dir: "{{ spm_config_dir }}"
      register: r_latest
    - assert:
        that:
          - r_latest.changed == false
        fail_msg: "expected changed=false when already at latest"

    - name: "absent (installed) -> removes, changed"
      static_pkgmgr:
        name: helloapp
        state: absent
        test_mode: true
        config_dir: "{{ spm_config_dir }}"
      register: r_absent_1
    - assert:
        that:
          - r_absent_1.changed == true
        fail_msg: "expected changed=true when uninstalling helloapp"

    - name: "absent (not installed) -> no change"
      static_pkgmgr:
        name: helloapp
        state: absent
        test_mode: true
        config_dir: "{{ spm_config_dir }}"
      register: r_absent_2
    - assert:
        that:
          - r_absent_2.changed == false
        fail_msg: "expected changed=false when already absent"
